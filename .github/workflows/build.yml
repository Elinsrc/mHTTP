name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps for mbedtls generators
        run: python -m pip install jinja2 jsonschema

      - name: Install development tools
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install cmake build-essential gcc-multilib g++-multilib ninja-build

      - name: Build on Linux
        if: startsWith(matrix.os, 'ubuntu') && matrix.cc == 'gcc'
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -B build -S .
          cmake --build build --target mhttp-cli

      - name: Set developer command prompt for Windows
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build on Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build -S .
          cmake --build build --target mhttp-cli

      - name: Extract branch name
        shell: bash
        id: extract_branch
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/} | tr '/' '_')" >> $GITHUB_OUTPUT

      - name: Upload linux artifact
        if: startsWith(matrix.os, 'ubuntu') && matrix.cc == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: mHTTP-${{ steps.extract_branch.outputs.branch }}-linux
          path: build/mhttp-cli

      - name: Upload windows artifact
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: mHTTP-${{ steps.extract_branch.outputs.branch }}-windows
          path: build/mhttp-cli.exe

  release:
    name: Upload release
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
  
      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
  
      - name: Set tag name
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ] || [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG_NAME="continuous"
          else
            TAG_NAME="continuous-${GITHUB_REF_NAME}"
          fi
          RELEASE_NAME="mHTTP $TAG_NAME Build"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
  
      - name: Remove old release if exists
        run: |
          if gh release list --repo ${{ github.repository }} | grep -q -e "$TAG_NAME"; then
            echo "Deleting existing release $TAG_NAME"
            gh release delete "$TAG_NAME" --yes --cleanup-tag --repo ${{ github.repository }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Create archives
        run: |
          mkdir -p files
          
          zip -j files/mHTTP-linux.zip artifacts/mHTTP-*-linux/*
          zip -j files/mHTTP-windows.zip artifacts/mHTTP-*-windows/*

          ls -la files/
  
      - name: Upload new release
        run: |
          gh release create "$TAG_NAME" \
            files/* \
            --title "$RELEASE_NAME" \
            --prerelease \
            --repo ${{ github.repository }} \
            --target ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}